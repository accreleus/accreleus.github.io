<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Accreleus master symbol</title>
  <desc id="desc">A spectral accretion crescent surrounds a dark nucleus crossed by a horizontal gravitational lens.</desc>
  <defs>
    <linearGradient id="orbit" x1="410" y1="160" x2="930" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="oklch(0.6033 0.2296 287.92)"/>
      <stop offset="0.54" stop-color="oklch(0.6074 0.2126 262.24)"/>
      <stop offset="1" stop-color="oklch(0.8422 0.1342 204.54)"/>
    </linearGradient>
    <linearGradient id="lens" x1="65" y1="360" x2="1135" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="oklch(0.6074 0.2126 262.24 / 0)"/>
      <stop offset="0.18" stop-color="oklch(0.6074 0.2126 262.24)"/>
      <stop offset="0.39" stop-color="oklch(0.9618 0.0086 247.91)"/>
      <stop offset="0.58" stop-color="oklch(0.9618 0.0086 247.91)"/>
      <stop offset="0.82" stop-color="oklch(0.8422 0.1342 204.54)"/>
      <stop offset="1" stop-color="oklch(0.8422 0.1342 204.54 / 0)"/>
    </linearGradient>
    <linearGradient id="rim" x1="410" y1="235" x2="680" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="oklch(0.9618 0.0086 247.91)"/>
      <stop offset="0.74" stop-color="oklch(0.9618 0.0086 247.91)"/>
      <stop offset="1" stop-color="oklch(0.8422 0.1342 204.54)"/>
    </linearGradient>
    <mask id="crescent">
      <!-- backing plate removed: the page supplies its own canvas -->
      <circle cx="675" cy="360" r="270" fill="white"/>
      <circle cx="598" cy="360" r="224" fill="black"/>
    </mask>
  </defs>
  <circle cx="675" cy="360" r="270" fill="url(#orbit)" mask="url(#crescent)"/>
  <path fill="url(#lens)" d="M65 360C245 356 347 348 413 326c46-15 76-39 105-52 28-13 57-8 83 12 54 41 126 57 534 74-408 17-480 33-534 74-26 20-55 25-83 12-29-13-59-37-105-52-66-22-168-30-348-34Z"/>
  <circle cx="545" cy="360" r="139" fill="oklch(0.105 0.01 267)" stroke="url(#rim)" stroke-width="9"/>
</svg>
